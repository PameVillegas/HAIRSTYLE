<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairStyle - Registrarse</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .box {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo {
      display: block;
      margin: 0 auto 15px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e91e63;
    }
    h2 {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      color: #e91e63;
      margin-bottom: 5px;
      font-size: 22px;
    }
    p {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #e91e63; }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .btn-secondary {
      background: white;
      color: #e91e63;
      border: 2px solid #e91e63;
    }
    
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .msg.success { background: #e8f5e9; color: #4caf50; }
    .msg.error { background: #ffebee; color: #f44336; }
    
    .link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
    .link a { color: #e91e63; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/fotos/logo.png" class="logo" alt="HairStyle">
    <h2>Crear Cuenta</h2>
    <p>Registrate para pedir turnos</p>
    <div id="msg"></div>
    <form id="form">
      <div class="form-group">
        <label>Nombre completo *</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="form-group">
        <label>Usuario *</label>
        <input type="text" id="username" placeholder="Nombre para iniciar sesión" required>
      </div>
      <div class="form-group">
        <label>Contraseña *</label>
        <input type="password" id="password" placeholder="Tu contraseña" required>
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej: 3388673804">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@ejemplo.com">
      </div>
      <button type="submit" id="btn">CREAR CUENTA</button>
      <button type="button" class="btn-secondary" onclick="window.location.href='/entrar.html'">Ya tengo cuenta</button>
    </form>
  </div>

  <script>
    document.getElementById('form').onsubmit = async function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn');
      var msg = document.getElementById('msg');
      
      btn.disabled = true;
      btn.textContent = 'CREANDO...';
      msg.innerHTML = '';
      
      var data = {
        username: document.getElementById('username').value,
        nombre: document.getElementById('nombre').value,
        password: document.getElementById('password').value,
        telefono: document.getElementById('telefono').value || null,
        email: document.getElementById('email').value || null
      };
      
      try {
        var res = await fetch('/api/auth/registrar', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        var result = await res.json();
        
        if (result.success) {
          msg.innerHTML = '<div class="msg success">¡Cuenta creada exitosamente!</div>';
          setTimeout(function() { window.location.href = '/entrar.html'; }, 1500);
        } else {
          msg.innerHTML = '<div class="msg error">' + (result.error || 'Error al registrar') + '</div>';
          btn.disabled = false;
          btn.textContent = 'CREAR CUENTA';
        }
      } catch(err) {
        msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        btn.disabled = false;
        btn.textContent = 'CREAR CUENTA';
      }
    };
  </script>
</body>
</html>
