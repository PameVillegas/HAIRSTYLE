<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairStyle - Mi Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 25px 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 26px; color: white; }
    .header .welcome { color: #ffd54f; font-size: 18px; font-weight: 600; }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .card h2 {
      font-family: 'Poppins', sans-serif;
      color: #e91e63;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .info-item:last-child { border-bottom: none; }
    .info-item .label { color: #666; font-size: 14px; }
    .info-item .value { font-weight: 600; color: #333; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 15px;
    }
    .btn:active { opacity: 0.9; }
    .btn.secondary {
      background: white;
      color: #e91e63;
      border: 2px solid #e91e63;
    }
    .btn.danger {
      background: #f44336;
    }
    .btn.small {
      padding: 10px 16px;
      font-size: 14px;
      width: auto;
      display: inline-block;
    }
    
    .logout-section {
      text-align: center;
      margin-top: 20px;
    }
    .logout-link { color: rgba(255,255,255,0.8); text-decoration: underline; cursor: pointer; }
    
    .turno-item {
      padding: 15px;
      background: #f8f8f8;
      border-radius: 10px;
      margin-bottom: 10px;
      border-left: 4px solid #e91e63;
    }
    .turno-item .fecha { font-weight: 600; color: #333; }
    .turno-item .detalle { font-size: 13px; color: #666; margin-top: 5px; }
    .turno-item .estado {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      margin-top: 8px;
    }
    .estado.pendiente { background: #fff3e0; color: #ff9800; }
    .estado.completado { background: #e8f5e9; color: #4caf50; }
    .estado.cancelado { background: #ffebee; color: #f44336; }
    
    .trat-card { 
      background: #f8f8f8; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      overflow: hidden; 
    }
    .trat-image { 
      width: 100%; 
      height: 140px; 
      object-fit: cover; 
      object-position: center;
      background: #ddd;
    }
    .trat-content { padding: 12px; text-align: center; }
    .trat-content .name { font-weight: 600; color: #333; font-size: 16px; }
    .trat-content .detail { font-size: 13px; color: #666; margin-top: 5px; }
    .trat-content .precio { font-weight: 700; color: #4caf50; margin-top: 10px; font-size: 18px; }
    .trat-content .solicitar { 
      display: block; 
      width: 100%; 
      margin-top: 10px; 
      padding: 10px; 
      background: #e91e63; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
      font-weight: 600;
    }
    .trat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .galeria-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; }
    .galeria-categoria { margin-bottom: 15px; }
    .galeria-categoria h3 { color: #e91e63; font-size: 14px; margin-bottom: 8px; }
    
    .solicitar-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    
    .error-page {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 16px;
    }
    .error-page h2 { color: #e91e63; margin-bottom: 15px; }
    .error-page a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
    }
    
    .loading { text-align: center; padding: 40px; color: #666; }
    .empty-state { text-align: center; padding: 30px; color: #666; }
    
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: white; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Poppins', sans-serif; color: #e91e63; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 4px; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
    .form-group input:focus { outline: none; border-color: #e91e63; }
    
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .msg.success { background: #e8f5e9; color: #4caf50; }
    .msg.error { background: #ffebee; color: #f44336; }
    
    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:active { background: #eee; }
    .menu-item .icon { font-size: 24px; }
    .menu-item .text { flex: 1; }
    .menu-item .text .title { font-weight: 600; color: #333; }
    .menu-item .text .desc { font-size: 12px; color: #666; }
    
    .actions-bar {
      display: flex;
      gap: 10px;
    }
    
    .trat-card { 
      background: #f8f8f8; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      overflow: hidden; 
    }
    .trat-image { 
      width: 100%; 
      height: 140px; 
      object-fit: cover; 
      background: #ddd;
    }
    .trat-content { padding: 12px; }
    .trat-content .name { font-weight: 600; color: #333; font-size: 16px; }
    .trat-content .detail { font-size: 13px; color: #666; margin-top: 5px; }
    .trat-content .precio { font-weight: 700; color: #4caf50; margin-top: 10px; font-size: 18px; }
    .trat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    @media (max-width: 400px) {
      .trat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app"></div>
  </div>
  
  <div id="modal-container"></div>

  <script>
    var API = '/api';
    var u = localStorage.getItem('u');
    var t = localStorage.getItem('t');
    
    if (!u || t !== 'cliente') {
      document.getElementById('app').innerHTML = 
        '<div class="error-page">' +
          '<h2>Acceso denegado</h2>' +
          '<p>Esta sección es solo para clientes</p>' +
          '<a href="/entrar.html">Ir al login</a>' +
        '</div>';
    } else {
      var user = JSON.parse(u);
      showClienteHome();
    }
    
    function logout() {
      localStorage.removeItem('u');
      localStorage.removeItem('t');
      window.location.href = '/entrar.html';
    }
    
    function showClienteHome() {
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h1>HairStyle</h1>' +
          '<p class="welcome">¡Hola, ' + user.nombre + '!</p>' +
          '<p style="color:rgba(255,255,255,0.8);font-size:14px;margin-top:5px;">Bienvenida a tu cuenta</p>' +
        '</div>' +
        
        '<div class="card">' +
          '<h2>👤 Mis Datos</h2>' +
          '<div class="info-item"><span class="label">Nombre</span><span class="value">' + (user.nombre || '-') + '</span></div>' +
          '<div class="info-item"><span class="label">Teléfono</span><span class="value">' + (user.telefono || '-') + '</span></div>' +
          '<div class="info-item"><span class="label">Email</span><span class="value">' + (user.email || '-') + '</span></div>' +
          '<div class="actions-bar">' +
            '<button class="btn small secondary" onclick="editarMiPerfil()">✏️ Editar</button>' +
            '<button class="btn small danger" onclick="eliminarMiCuenta()">🗑️ Eliminar</button>' +
          '</div>' +
          '<button class="btn" onclick="showMisTurnos()">📅 Mis Turnos</button>' +
        '</div>' +
        
        '<div class="card">' +
          '<h2>💅 Servicios</h2>' +
          '<div class="menu-item" onclick="showServicios()">' +
            '<span class="icon">💆</span>' +
            '<span class="text"><span class="title">Todos los servicios</span><span class="desc">Ver servicios disponibles</span></span>' +
          '</div>' +
          '<div class="menu-item" onclick="showPromociones()">' +
            '<span class="icon">🎉</span>' +
            '<span class="text"><span class="title">Promociones</span><span class="desc">Ofertas especiales</span></span>' +
          '</div>' +
          '<div class="menu-item" onclick="showGaleriaCliente()">' +
            '<span class="icon">📸</span>' +
            '<span class="text"><span class="title">Galería</span><span class="desc">Fotos del salón</span></span>' +
          '</div>' +
        '</div>' +
        
        '<div class="card">' +
          '<h2>📋 Solicitar Turno</h2>' +
          '<p style="color:#666;font-size:13px;margin-bottom:15px;">¿Querés un turno? Solicitá uno y te contactaremos</p>' +
          '<button class="btn" onclick="showSolicitarTurno()">📅 Solicitar Turno</button>' +
        '</div>' +
        
        '<div class="logout-section">' +
          '<span class="logout-link" onclick="logout()">Cerrar sesión</span>' +
        '</div>';
    }
    
    // EDITAR MI PERFIL
    function editarMiPerfil() {
      document.getElementById('modal-container').innerHTML = 
        '<div class="modal" onclick="closeModal()">' +
          '<div class="modal-content" onclick="event.stopPropagation()">' +
            '<h3>✏️ Editar Mi Perfil</h3>' +
            '<div id="edit-msg"></div>' +
            '<form id="edit-form">' +
              '<div class="form-group"><label>Nombre</label><input type="text" id="edit-nombre" value="' + (user.nombre || '') + '"></div>' +
              '<div class="form-group"><label>Usuario</label><input type="text" id="edit-username" value="' + (user.username || '') + '"></div>' +
              '<div class="form-group"><label>Nueva contraseña (dejar vacío para no cambiar)</label><input type="password" id="edit-password" placeholder="Nueva contraseña"></div>' +
              '<div class="form-group"><label>Teléfono</label><input type="tel" id="edit-telefono" value="' + (user.telefono || '') + '"></div>' +
              '<div class="form-group"><label>Email</label><input type="email" id="edit-email" value="' + (user.email || '') + '"></div>' +
              '<button type="submit" class="btn">Guardar Cambios</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById('edit-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('edit-msg');
        var password = document.getElementById('edit-password').value;
        var updateData = {
          username: document.getElementById('edit-username').value,
          nombre: document.getElementById('edit-nombre').value,
          telefono: document.getElementById('edit-telefono').value || null,
          email: document.getElementById('edit-email').value || null
        };
        if (password) updateData.password = password;
        
        try {
          var res = await fetch(API + '/clientes/' + user.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(updateData)
          });
          var result = await res.json();
          
          if (result.success) {
            msg.innerHTML = '<div class="msg success">¡Perfil actualizado!</div>';
            // Actualizar localStorage
            var newUser = { ...user, ...updateData };
            delete newUser.password;
            localStorage.setItem('u', JSON.stringify(newUser));
            user = newUser;
            setTimeout(function() { closeModal(); showClienteHome(); }, 1000);
          } else {
            msg.innerHTML = '<div class="msg error">' + result.error + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
    
    // ELIMINAR MI CUENTA
    function eliminarMiCuenta() {
      if (!confirm('¿Estás seguro de eliminar tu cuenta?\n\nEsta acción no se puede deshacer y perderás todos tus datos.')) return;
      
      var confirmar = confirm('Para confirmar, escribí "eliminar"');
      if (confirmar) {
        fetch(API + '/clientes/' + user.id, { method: 'DELETE' })
          .then(function(res) { return res.json(); })
          .then(function(result) {
            if (result.success) {
              logout();
            } else {
              alert(result.error || 'Error al eliminar');
            }
          })
          .catch(function() { alert('Error de conexión'); });
      }
    }
    
    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }
    
    // MIS TURNOS
    async function showMisTurnos() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📅 Mis Turnos</h1></div>' +
        '<div class="card"><div id="turnos-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/cliente/' + user.id);
        var data = await res.json();
        
        if (data.success && data.turnos && data.turnos.length > 0) {
          var html = '';
          data.turnos.forEach(function(t) {
            var badgeClass = t.estado === 'pendiente' ? 'pendiente' : (t.estado === 'completado' ? 'completado' : 'cancelado');
            html += '<div class="turno-item">' +
              '<div class="fecha">📅 ' + t.fecha + ' - ' + t.hora + '</div>' +
              '<div class="detalle">💅 ' + t.tratamiento + (t.precio > 0 ? ' - $' + t.precio : '') + '</div>' +
              '<span class="estado ' + badgeClass + '">' + t.estado + '</span>' +
            '</div>';
          });
          document.getElementById('turnos-content').innerHTML = html;
        } else {
          document.getElementById('turnos-content').innerHTML = '<div class="empty-state">No tenés turnos registrados</div>';
        }
      } catch(err) {
        document.getElementById('turnos-content').innerHTML = '<div class="empty-state">Error cargando turnos</div>';
      }
    }
    
    // SERVICIOS
    async function showServicios() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>💅 Servicios</h1></div>' +
        '<div class="card"><div id="serv-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/tratamientos');
        var tratamientos = await res.json();
        
        if (tratamientos.length > 0) {
          var html = '<div class="trat-grid">';
          tratamientos.forEach(function(t) {
            var precio = parseFloat(t.precio || 0);
            var img = t.imagen_url || '/fotos/logo.png';
            var nombre = t.nombre || '';
            var esFacial = nombre.toUpperCase().indexOf('FACIAL') >= 0;
            
            html += '<div class="trat-card">' +
              '<img src="' + img + '" class="trat-image" onerror="this.src=\'/fotos/logo.png\'">' +
              '<div class="trat-content">' +
                '<div class="name">' + nombre + '</div>' +
                '<div class="detail">' + t.duracion + ' min - ' + (t.descripcion || '') + '</div>' +
                '<div class="precio">' + (precio > 0 ? '$' + precio.toLocaleString('es-AR') : 'Consultar precio') + '</div>';
            
            if (precio === 0) {
              // Tratamiento con precio a consultar - botón WhatsApp
              var mensaje = encodeURIComponent('Hola! Quiero consultar por el tratamiento: ' + nombre);
              html += '<a href="https://wa.me/543388673804?text=' + mensaje + '" class="solicitar" style="display:block;text-align:center;text-decoration:none;margin-top:10px;padding:10px;background:#25D366;color:white;border-radius:8px;font-weight:600;">💬 Consultar por WhatsApp</a>';
            } else if (esFacial) {
              // Tratamiento facial - botón para completar planilla
              html += '<button class="solicitar" onclick="mostrarPlanillaFacial(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📋 Completar Planilla Anamnesis</button>';
            } else {
              // Tratamiento normal - solicitar turno
              html += '<button class="solicitar" onclick="solicitarTurnoTratamiento(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📅 Solicitar Turno</button>';
            }
            
            html += '</div></div>';
          });
          html += '</div>';
          document.getElementById('serv-content').innerHTML = html;
        } else {
          document.getElementById('serv-content').innerHTML = '<div class="empty-state">No hay servicios disponibles</div>';
        }
      } catch(err) {
        document.getElementById('serv-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    // Solicitar turno de un tratamiento específico
    function solicitarTurnoTratamiento(tratamientoId, tratamientoNombre) {
      showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre);
    }
    
    async function showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre) {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showServicios()">← Volver</button>' +
        '<div class="header"><h1>📅 Turno: ' + tratamientoNombre + '</h1></div>' +
        '<div class="card"><div id="solicitar-form"><div class="loading">Cargando...</div></div></div>';
      
      // Obtener fecha minima (mañana)
      var manana = new Date();
      manana.setDate(manana.getDate() + 1);
      var fechaMin = manana.toISOString().split('T')[0];
      
      document.getElementById('solicitar-form').innerHTML = 
        '<div id="solicitar-msg"></div>' +
        '<form id="solicitar-turno-form">' +
          '<div class="form-group"><label>Tratamiento</label><input type="text" value="' + tratamientoNombre + '" disabled></div>' +
          '<div class="form-group"><label>Fecha preferida *</label><input type="date" id="sol-fecha" min="' + fechaMin + '" required></div>' +
          '<div class="form-group"><label>Horario preferdio *</label><select id="sol-hora" required>' +
            '<option value="">Seleccionar horario</option>' +
            '<option value="09:00">09:00</option><option value="09:30">09:30</option>' +
            '<option value="10:00">10:00</option><option value="10:30">10:30</option>' +
            '<option value="11:00">11:00</option><option value="11:30">11:30</option>' +
            '<option value="12:00">12:00</option><option value="12:30">12:30</option>' +
            '<option value="13:00">13:00</option><option value="13:30">13:30</option>' +
            '<option value="14:00">14:00</option><option value="14:30">14:30</option>' +
            '<option value="15:00">15:00</option><option value="15:30">15:30</option>' +
            '<option value="16:00">16:00</option><option value="16:30">16:30</option>' +
            '<option value="17:00">17:00</option><option value="17:30">17:30</option>' +
            '<option value="18:00">18:00</option>' +
          '</select></div>' +
          '<div class="form-group"><label>Notas adicionales</label><textarea id="sol-notas" rows="3" placeholder="Observaciones..."></textarea></div>' +
          '<button type="submit" class="btn">📨 Solicitar Turno</button>' +
        '</form>';
      
      document.getElementById('solicitar-turno-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('solicitar-msg');
        
        var data = {
          cliente_id: user.id,
          tratamiento_id: tratamientoId,
          fecha: document.getElementById('sol-fecha').value,
          hora: document.getElementById('sol-hora').value,
          notas: document.getElementById('sol-notas').value || 'Solicitado por cliente'
        };
        
        try {
          var res = await fetch(API + '/turnos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
          });
          var result = await res.json();
          
          if (result.id || result.success) {
            msg.innerHTML = '<div class="msg success">¡Turno solicitado! Te contactaremos para confirmar.</div>';
            setTimeout(function() { showMisTurnos(); }, 2000);
          } else {
            msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
    
    // MOSTRAR PLANILLA DE ANAMNESIS FACIAL
    function mostrarPlanillaFacial(tratamientoId, tratamientoNombre) {

              '<h4 style="color:#e91e63;margin-bottom:10px;">Datos del tratamiento</h4>' +

                '<select id="plan-tipo-piel" required>' +
                  '<option value="">Seleccionar</option>' +
                  '<option value="Normal">Normal</option>' +
                  '<option value="Seca">Seca</option>' +
                  '<option value="Grasa">Grasa</option>' +
                  '<option value="Mixta">Mixta</option>' +
                  '<option value="Sensible">Sensible</option>' +
                '</select></div>' +
              '<div class="form-group"><label>¿Tiene alergias?</label><select id="plan-alergias"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>Si tiene alergias, especificar</label><input type="text" id="plan-alergias-detalle" placeholder="¿A qué es alérgico/a?"></div>' +
              '<div class="form-group"><label>¿Usa algún medicamento?</label><select id="plan-medicamentos"><option value="No">No</option><option value="Si">Sí</option></select></div>' +

              '<div class="form-group"><label>¿Tiene problemas de salud?</label><select id="plan-problemas"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>Si tiene problemas, especificar</label><input type="text" id="plan-problemas-detalle" placeholder="¿Qué problemas tiene?"></div>' +
              '<div class="form-group"><label>¿Embarazada?</label><select id="plan-embarazada"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>Último tratamiento facial (fecha aproximada)</label><input type="text" id="plan-ultimo" placeholder="Hace cuánto tiempo"></div>' +
              '<div class="form-group"><label>Comentarios adicionales</label><textarea id="plan-comentarios" rows="3" placeholder="Algo que debamos saber..."></textarea></div>' +
              '<button type="submit" class="btn">💾 Guardar y Solicitar Turno</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById('planilla-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('planilla-msg');
        
        // Guardar en legajos
        var datosPlanilla = {
          tipo_piel: document.getElementById('plan-tipo-piel').value,
          alergias: document.getElementById('plan-alergias').value,
          alergias_detalle: document.getElementById('plan-alergias-detalle').value,
          medicamentos: document.getElementById('plan-medicamentos').value,
          medicamentos_detalle: document.getElementById('plan-medicamentos-detalle').value,
          problemas_salud: document.getElementById('plan-problemas').value,
          problemas_detalle: document.getElementById('plan-problemas-detalle').value,
          embarazada: document.getElementById('plan-embarazada').value,
          ultimo_tratamiento: document.getElementById('plan-ultimo').value,
          comentarios: document.getElementById('plan-comentarios').value
        };
        
        var legajoData = {
          cliente_id: user.id,
          tratamiento: tratamientoNombre,
          tipo: 'facial',
          fecha: new Date().toISOString().split('T')[0],
          datos: JSON.stringify(datosPlanilla)
        };
        
        try {
          // Guardar legajo
          var resLegajo = await fetch(API + '/legajos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(legajoData)
          });
          var resultLegajo = await resLegajo.json();
          
          // Solicitar turno
          var turnoData = {
            cliente_id: user.id,
            tratamiento_id: tratamientoId,
            fecha: new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0], // 7 días después
            hora: '10:00',
            notas: 'Tratamiento facial - Planilla de anamnesis completada'
          };
          
          var resTurno = await fetch(API + '/turnos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(turnoData)
          });
          
          msg.innerHTML = '<div class="msg success">¡Planilla guardada! Tu turno ha sido solicitado. Te contactaremos para confirmar.</div>';
          setTimeout(function() { 
            closeModal(); 
            showMisTurnos(); 
          }, 2000);
          
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error al guardar. Intentá de nuevo.</div>';
        }
      };
    }
    
    // PROMOCIONES
    async function showPromociones() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>🎉 Promociones</h1></div>' +
        '<div class="card"><div id="promo-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/promociones');
        var promos = await res.json();
        
        if (promos.length > 0) {
          var html = '';
          promos.forEach(function(p) {
            html += '<div class="menu-item" style="cursor:default;flex-direction:column;align-items:flex-start;">' +
              '<span style="font-size:24px;">🎉</span>' +
              '<div style="margin-top:10px;width:100%;">' +
                '<span class="title" style="font-size:16px;">' + p.titulo + '</span>' +
                '<span class="desc" style="display:block;margin-top:5px;">' + (p.descripcion || '') + '</span>';
            if (p.precio_especial) {
              html += '<span style="color:#4caf50;font-weight:700;margin-top:8px;display:block;">Precio especial: $' + parseFloat(p.precio_especial).toLocaleString('es-AR') + '</span>';
            }
            html += '</div></div>';
          });
          document.getElementById('promo-content').innerHTML = html;
        } else {
          document.getElementById('promo-content').innerHTML = '<div class="empty-state">No hay promociones activas</div>';
        }
      } catch(err) {
        document.getElementById('promo-content').innerHTML = '<div class="empty-state">Error cargando promociones</div>';
      }
    }
    
    // GALERÍA CLIENTE
    async function showGaleriaCliente() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📸 Galería</h1></div>' +
        '<div class="card"><div id="galeria-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/galeria/local');
        var galeria = await res.json();
        
        if (galeria.length === 0) {
          document.getElementById('galeria-content').innerHTML = '<div class="empty-state">No hay fotos disponibles</div>';
        } else {
          var html = '';
          galeria.forEach(function(cat) {
            html += '<div class="galeria-categoria">' +
              '<h3>' + (cat.icon || '📷') + ' ' + cat.nombre + '</h3>' +
              '<div class="galeria-grid">';
            cat.imagenes.forEach(function(img) {
              html += '<img src="' + img.url + '" class="galeria-img" onerror="this.style.display=\'none\'">';
            });
            html += '</div></div>';
          });
          document.getElementById('galeria-content').innerHTML = html;
        }
      } catch(err) {
        document.getElementById('galeria-content').innerHTML = '<div class="empty-state">Error cargando galería</div>';
      }
    }
    
    // SOLICITAR TURNO
    async function showSolicitarTurno() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:10px 20px;border-radius:20px;margin-bottom:20px;cursor:pointer;" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📅 Solicitar Turno</h1></div>' +
        '<div class="card"><div id="solicitar-form"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/tratamientos');
        var tratamientos = await res.json();
        
        var tratamientoOptions = '<option value="">Seleccionar tratamiento</option>';
        tratamientos.forEach(function(t) {
          var precio = parseFloat(t.precio || 0);
          var precioTexto = precio > 0 ? '$' + precio.toLocaleString('es-AR') : 'Consultar';
          tratamientoOptions += '<option value="' + t.id + '">' + t.nombre + ' (' + precioTexto + ')</option>';
        });
        
        // Obtener fecha minima (mañana)
        var manana = new Date();
        manana.setDate(manana.getDate() + 1);
        var fechaMin = manana.toISOString().split('T')[0];
        
        document.getElementById('solicitar-form').innerHTML = 
          '<div id="solicitar-msg"></div>' +
          '<form id="solicitar-turno-form">' +
            '<div class="form-group"><label>Tratamiento *</label><select id="sol-tratamiento" required>' + tratamientoOptions + '</select></div>' +
            '<div class="form-group"><label>Fecha preferida *</label><input type="date" id="sol-fecha" min="' + fechaMin + '" required></div>' +
            '<div class="form-group"><label>Horario preferidio *</label><select id="sol-hora" required>' +
              '<option value="">Seleccionar horario</option>' +
              '<option value="09:00">09:00</option>' +
              '<option value="09:30">09:30</option>' +
              '<option value="10:00">10:00</option>' +
              '<option value="10:30">10:30</option>' +
              '<option value="11:00">11:00</option>' +
              '<option value="11:30">11:30</option>' +
              '<option value="12:00">12:00</option>' +
              '<option value="12:30">12:30</option>' +
              '<option value="13:00">13:00</option>' +
              '<option value="13:30">13:30</option>' +
              '<option value="14:00">14:00</option>' +
              '<option value="14:30">14:30</option>' +
              '<option value="15:00">15:00</option>' +
              '<option value="15:30">15:30</option>' +
              '<option value="16:00">16:00</option>' +
              '<option value="16:30">16:30</option>' +
              '<option value="17:00">17:00</option>' +
              '<option value="17:30">17:30</option>' +
              '<option value="18:00">18:00</option>' +
            '</select></div>' +
            '<div class="form-group"><label>Notas adicionales</label><textarea id="sol-notas" rows="3" placeholder="Alguna observación o preferencia especial..."></textarea></div>' +
            '<button type="submit" class="btn">📨 Enviar Solicitud</button>' +
          '</form>';
        
        document.getElementById('solicitar-turno-form').onsubmit = async function(e) {
          e.preventDefault();
          var msg = document.getElementById('solicitar-msg');
          
          var data = {
            cliente_id: user.id,
            tratamiento_id: document.getElementById('sol-tratamiento').value,
            fecha: document.getElementById('sol-fecha').value,
            hora: document.getElementById('sol-hora').value,
            notas: document.getElementById('sol-notas').value || 'Solicitado por cliente'
          };
          
          try {
            var res = await fetch(API + '/turnos', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
            });
            var result = await res.json();
            
            if (result.id || result.success) {
              msg.innerHTML = '<div class="msg success">¡Solicitud enviada! Te contactaremos para confirmar tu turno.</div>';
              setTimeout(function() { showMisTurnos(); }, 2000);
            } else {
              msg.innerHTML = '<div class="msg error">' + (result.error || 'Error al enviar solicitud') + '</div>';
            }
          } catch(err) {
            msg.innerHTML = '<div class="msg error">Error de conexión</div>';
          }
        };
      } catch(err) {
        document.getElementById('solicitar-form').innerHTML = '<div class="empty-state">Error cargando datos</div>';
      }
    }
  </script>
