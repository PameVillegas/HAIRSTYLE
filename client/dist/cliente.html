<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairStyle - Mi Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    html { scroll-behavior: smooth; }
    body::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; padding: 20px; max-width: 600px; margin: 0 auto; overflow-y: auto; height: calc(100vh - 40px); padding-bottom: 100px; -ms-overflow-style: none; scrollbar-width: none; }
    .container::-webkit-scrollbar { display: none; }
    
    .header {
      text-align: center;
      padding: 25px 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 26px; color: white; }
    .header .welcome { color: #ffd54f; font-size: 18px; font-weight: 600; }
    
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card h2 { font-family: 'Poppins', sans-serif; color: #e91e63; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .menu-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 10px; background: linear-gradient(135deg, #e91e63, #9c27b0);
      border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer; transition: transform 0.2s;
    }
    .menu-box:active { transform: scale(0.95); }
    .menu-box .menu-icon { font-size: 28px; margin-bottom: 8px; }
    .menu-box .menu-label { font-weight: 600; font-size: 12px; color: white; text-align: center; }
    .menu-box.secondary { background: white; border: 2px solid #e91e63; }
    .menu-box.secondary .menu-label { color: #e91e63; }
    
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; background: rgba(255,255,255,0.2); color: white;
      border: none; border-radius: 20px; cursor: pointer; margin-bottom: 20px; font-size: 14px;
    }
    
    .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.9; }
    .btn.secondary { background: white; color: #e91e63; border: 2px solid #e91e63; }
    .btn.danger { background: #f44336; }
    .btn.small { padding: 10px 16px; font-size: 14px; width: auto; display: inline-block; }
    
    .info-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info-item:last-child { border-bottom: none; }
    .info-item .label { color: #666; font-size: 14px; }
    .info-item .value { font-weight: 600; color: #333; }
    
    .turno-item { padding: 15px; background: #f8f8f8; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #e91e63; }
    .turno-item .fecha { font-weight: 600; color: #333; }
    .turno-item .detalle { font-size: 13px; color: #666; margin-top: 5px; }
    .turno-item .estado { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin-top: 8px; }
    .estado.pendiente { background: #fff3e0; color: #ff9800; }
    .estado.completado { background: #e8f5e9; color: #4caf50; }
    .estado.cancelado { background: #ffebee; color: #f44336; }
    
    .trat-card { background: #f8f8f8; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .trat-image { width: 100%; height: 140px; object-fit: cover; background: #ddd; }
    .trat-content { padding: 12px; text-align: center; }
    .trat-content .name { font-weight: 600; color: #333; font-size: 16px; }
    .trat-content .detail { font-size: 13px; color: #666; margin-top: 5px; }
    .trat-content .precio { font-weight: 700; color: #4caf50; margin-top: 10px; font-size: 18px; }
    .trat-content .solicitar { display: block; width: 100%; margin-top: 10px; padding: 10px; background: #e91e63; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .trat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .galeria-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; }
    .galeria-categoria { margin-bottom: 15px; }
    .galeria-categoria h3 { color: #e91e63; font-size: 14px; margin-bottom: 8px; }
    
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: white; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Poppins', sans-serif; color: #e91e63; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 4px; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
    .form-group input:focus { outline: none; border-color: #e91e63; }
    
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .msg.success { background: #e8f5e9; color: #4caf50; }
    .msg.error { background: #ffebee; color: #f44336; }
    
    .whatsapp-float {
      position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px;
      background: #128C7E; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9998;
    }
    
    .testimonio-card { background: #f8f8f8; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
    .testimonio-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #e91e63, #9c27b0); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; }
    .testimonio-nombre { font-weight: 600; color: #333; font-size: 15px; }
    .testimonio-estrellas { color: #ffc107; font-size: 14px; }
    .testimonio-texto { color: #666; font-size: 14px; line-height: 1.5; margin-top: 10px; }
    
    .loading { text-align: center; padding: 40px; color: #666; }
    .empty-state { text-align: center; padding: 30px; color: #666; }
    
    .sobre-nosotros { background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .sobre-nosotros img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #e91e63; margin-bottom: 15px; }
    .perfil-nombre { font-family: 'Poppins', sans-serif; font-size: 20px; color: #e91e63; margin-bottom: 5px; }
    .perfil-edad { color: #666; font-size: 16px; margin-bottom: 20px; }
    .perfil-desc { text-align: left; color: #666; font-size: 14px; line-height: 1.6; }
    .perfil-desc p { margin-bottom: 12px; }
    .perfil-desc ul { margin: 10px 0 10px 20px; }
    .perfil-desc li { margin-bottom: 6px; }
    
    .redes-link { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; text-decoration: none; }
    .redes-link.instagram { background: #E1306C; color: white; }
    
    @media (max-width: 400px) {
      .trat-grid { grid-template-columns: 1fr; }
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
    
    .scroll-btn {
      position: fixed; left: 15px; width: 45px; height: 45px;
      background: linear-gradient(135deg, #e91e63, #9c27b0); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white; cursor: pointer; z-index: 9997;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: none;
      transition: transform 0.2s;
    }
    .scroll-btn:hover { transform: scale(1.1); }
    .scroll-up { bottom: 90px; }
    .scroll-down { bottom: 30px; }
    .scroll-btn:disabled { opacity: 0.3; cursor: default; transform: none; }
  </style>
</head>

  <button class="scroll-btn scroll-down" onclick="document.getElementById('app').parentElement.scrollTop += 200">▼</button>
  <div class="container">
    <div id="app"></div>
  </div>
  <div id="modal-container"></div>

  <script>
    var API = '/api';
    var u = localStorage.getItem('u');
    var t = localStorage.getItem('t');
    var user = null;
    
    if (!u || t !== 'cliente') {
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h2>Acceso denegado</h2>' +
          '<p>Esta sección es solo para clientes</p>' +
          '<a href="/entrar.html" class="btn">Ir al login</a>' +
        '</div>';
    } else {
      user = JSON.parse(u);
      window.user = user;
      showClienteHome();
    }
    
    function logout() {
      localStorage.removeItem('u');
      localStorage.removeItem('t');
      window.location.href = '/entrar.html';
    }
    
    // Recordatorio de turno 2 horas antes
    async function verificarRecordatorio() {
      try {
        var res = await fetch(API + '/turnos?cliente_id=' + user.id);
        var turnos = await res.json();
        
        var ahora = new Date();
        var dosHoras = 2 * 60 * 60 * 1000;
        
        turnos.forEach(function(t) {
          if (t.estado !== 'pendiente') return;
          
          var fechaTurno = new Date(t.fecha + 'T' + t.hora);
          var diff = fechaTurno - ahora;
          
          // Entre 1.5 y 2.5 horas = entre 90 y 150 minutos
          var minutos = diff / 60000;
          if (minutos >= 90 && minutos <= 150) {
            var yaMostrado = localStorage.getItem('recordatorio_' + t.id);
            if (!yaMostrado) {
              var mensaje = '⏰ Recordatorio: Tu turno es en aproximadamente ' + Math.round(minutos) + ' minutos!\n\n' +
                '📅 ' + t.fecha + ' a las ' + t.hora + '\n' +
                '💅 ' + (t.tratamiento_nombre || 'Servicio');
              alert(mensaje);
              localStorage.setItem('recordatorio_' + t.id, 'mostrado');
            }
          }
        });
      } catch(e) {}
    }
    
    function showClienteHome() {
      // Verificar recordatorio de turno
      verificarRecordatorio();
      
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h1>HairStyle</h1>' +
          '<p class="welcome">¡Hola, ' + user.nombre + '!</p>' +
          '<p style="color:rgba(255,255,255,0.8);font-size:14px;margin-top:5px;">Bienvenida a tu cuenta</p>' +
        '</div>' +
        
        '<div class="menu-grid">' +
          '<div class="menu-box" onclick="showServicios()"><span class="menu-icon">💅</span><span class="menu-label">Servicios</span></div>' +
          '<div class="menu-box" onclick="showGaleriaCliente()"><span class="menu-icon">📸</span><span class="menu-label">Galería</span></div>' +
          '<div class="menu-box" onclick="showMisTurnos()"><span class="menu-icon">📅</span><span class="menu-label">Mis Turnos</span></div>' +
          '<div class="menu-box" onclick="showTestimonios()"><span class="menu-icon">⭐</span><span class="menu-label">Reseñas</span></div>' +
          '<div class="menu-box" onclick="showPromociones()"><span class="menu-icon">🎉</span><span class="menu-label">Promos</span></div>' +
          '<div class="menu-box" onclick="showSobreNosotros()"><span class="menu-icon">✨</span><span class="menu-label">Sobre Mí</span></div>' +
          '<div class="menu-box" onclick="showPoliticas()"><span class="menu-icon">📜</span><span class="menu-label">Políticas</span></div>' +
          '<div class="menu-box" onclick="showTerminos()"><span class="menu-icon">📋</span><span class="menu-label">Términos</span></div>' +
          '<div class="menu-box" onclick="showSolicitarTurno()"><span class="menu-icon">📆</span><span class="menu-label">Nuevo Turno</span></div>' +
        '</div>' +
        
        '<div class="card">' +
          '<h2>👤 Mi Perfil</h2>' +
          '<div class="info-item"><span class="label">Nombre</span><span class="value">' + (user.nombre || '-') + '</span></div>' +
          '<div class="info-item"><span class="label">Teléfono</span><span class="value">' + (user.telefono || '-') + '</span></div>' +
          '<button class="btn secondary" onclick="editarMiPerfil()">✏️ Editar Mi Perfil</button>' +
        '</div>' +
        
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);width:100%;text-align:center;margin-top:20px;" onclick="logout()">🚪 Cerrar sesión</button>';
    }
    
    // SERVICIOS
    async function showServicios() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>💅 Servicios</h1></div>' +
        '<div class="card"><div id="serv-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/tratamientos');
        var tratamientos = await res.json();
        
        if (tratamientos.length > 0) {
          var html = '<div class="trat-grid">';
          tratamientos.forEach(function(t) {
            var precio = parseFloat(t.precio || 0);
            var img = t.imagen_url || '/fotos/logo.png';
            var nombre = t.nombre || '';
            var descripcion = t.descripcion || '';
            var esLimpieza = nombre.toUpperCase().indexOf('LIMPIEZA') >= 0;
            var nombreUpper = nombre.toUpperCase();
            var esAlisado = nombreUpper.indexOf('ALISADO') >= 0 || nombreUpper.indexOf('BOTOX') >= 0 || nombreUpper.indexOf('CAPILAR') >= 0 || nombreUpper.indexOf('TRATAMIENTO') >= 0 || nombreUpper.indexOf('LISS') >= 0 || nombreUpper.indexOf('BRUSHING') >= 0 || nombreUpper.indexOf('PLANCHA') >= 0;
            
            var mostrarCM = esAlisado || precio === 0;
            
            html += '<div class="trat-card">' +
              '<img src="' + img + '" class="trat-image" onerror="this.src=\'/fotos/logo.png\'">' +
              '<div class="trat-content">' +
                '<div class="name">' + nombre + '</div>';
            
            if (esLimpieza) {
              html += '<div class="detail" style="font-size:12px;color:#555;margin:5px 0;">' + descripcion + '</div>';
              html += '<div style="font-size:11px;color:#888;margin:5px 0;">💛 Todas incluyen alta frecuencia</div>';
            } else {
              html += '<div class="detail">' + t.duracion + ' min' + (descripcion ? ' - ' + descripcion : '') + '</div>';
            }
            
            html += '<div class="precio">' + (precio > 0 ? '$' + precio.toLocaleString('es-AR') : 'Consultar precio') + '</div>';
            
            if (esAlisado) {
              html += '<button class="solicitar" onclick="solicitarTurnoTratamiento(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📅 Solicitar Turno</button>';
              html += '<div style="font-size:10px;color:#999;margin-top:5px;">Seleccioná largo del cabello</div>';
            } else if (precio === 0) {
              var mensaje = encodeURIComponent('Hola! Quiero consultar por el tratamiento: ' + nombre);
              html += '<a href="https://wa.me/543388673804?text=' + mensaje + '" class="solicitar" style="display:block;text-align:center;text-decoration:none;background:#128C7E;">💬 Consultar</a>';
            } else {
              html += '<button class="solicitar" onclick="solicitarTurnoTratamiento(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📅 Solicitar Turno</button>';
            }
            
            html += '</div></div>';
          });
          html += '</div>';
          document.getElementById('serv-content').innerHTML = html;
        } else {
          document.getElementById('serv-content').innerHTML = '<div class="empty-state">No hay servicios disponibles</div>';
        }
      } catch(err) {
        document.getElementById('serv-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    function solicitarTurnoTratamiento(tratamientoId, tratamientoNombre) {
      var nombreUpper = tratamientoNombre.toUpperCase();
      var esAlisado = nombreUpper.indexOf('TRATAMIENTOS Y ALISADOS') >= 0 || nombreUpper.indexOf('ALISADO') >= 0 || nombreUpper.indexOf('BOTOX') >= 0 || nombreUpper.indexOf('TRATAMIENTO') >= 0 || nombreUpper.indexOf('CAPILAR') >= 0;
      showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre, esAlisado);
    }
    
    async function showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre, requiereCM) {
      var manana = new Date();
      manana.setDate(manana.getDate() + 1);
      var fechaMin = manana.toISOString().split('T')[0];
      
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showServicios()">← Volver</button>' +
        '<div class="header"><h1>📅 Solicitar Turno</h1></div>' +
        '<div class="card"><div id="solicitar-form"></div></div>';
      
      var cmOptions = '';
      if (requiereCM) {
        cmOptions = '<div class="form-group"><label>Largo del cabello *</label>' +
          '<select id="sol-cm" required onchange="actualizarPrecioCM(this.value); cargarHorariosOcupados();">' +
            '<option value="">Seleccionar largo</option>' +
            '<option value="0-30">0 a 30 cm - $30.000</option>' +
            '<option value="30-40">30 a 40 cm - $32.000</option>' +
            '<option value="40-50">40 a 50 cm - $34.000</option>' +
            '<option value="50-60">50 a 60 cm - $36.000</option>' +
            '<option value="60-70">60 a 70 cm - $38.000</option>' +
            '<option value="70-80">70 a 80 cm - $40.000</option>' +
            '<option value="80-90">80 a 90 cm - $42.000</option>' +
          '</select></div>' +
          '<div id="precio-mostrado" style="background:#e8f5e9;padding:10px;border-radius:8px;text-align:center;font-weight:700;color:#4caf50;display:none;">Precio: <span id="precio-turno"></span></div>';
      }
      
      var extraField = requiereCM ? '<input type="hidden" id="sol-precio-extra" value="0">' : '';
      
      document.getElementById('solicitar-form').innerHTML = 
        '<div id="solicitar-msg"></div>' +
        '<form id="solicitar-turno-form">' +
          '<div class="form-group"><label>Tratamiento</label><input type="text" value="' + tratamientoNombre + '" disabled></div>' +
          cmOptions +
          '<div class="form-group"><label>Fecha *</label><input type="date" id="sol-fecha" min="' + fechaMin + '" required onchange="cargarHorariosOcupados()"></div>' +
          '<div class="form-group"><label>Horario *</label><select id="sol-hora" required>' +
            '<option value="">Seleccionar</option>' +
            '<option value="09:00">09:00</option><option value="09:30">09:30</option>' +
            '<option value="10:00">10:00</option><option value="10:30">10:30</option>' +
            '<option value="11:00">11:00</option><option value="11:30">11:30</option>' +
            '<option value="12:00">12:00</option><option value="12:30">12:30</option>' +
            '<option value="13:00">13:00</option><option value="13:30">13:30</option>' +
            '<option value="14:00">14:00</option><option value="14:30">14:30</option>' +
            '<option value="15:00">15:00</option><option value="15:30">15:30</option>' +
            '<option value="16:00">16:00</option><option value="16:30">16:30</option>' +
            '<option value="17:00">17:00</option><option value="17:30">17:30</option>' +
            '<option value="18:00">18:00</option>' +
          '</select></div>' +
          '<div class="form-group"><label>Notas</label><textarea id="sol-notas" rows="2" placeholder="Observaciones..."></textarea></div>' +
          extraField +
          '<button type="submit" class="btn">📨 Solicitar Turno</button>' +
        '</form>';
        
        var duracionGlobal = 60;
        
        function horaToMinutos(hora) {
          var h = parseInt(hora.split(':')[0]);
          var m = parseInt(hora.split(':')[1]);
          return h * 60 + m;
        }
        
        function cargarHorariosOcupados() {
          var fecha = document.getElementById('sol-fecha').value;
          if (!fecha || !requiereCM) return;
          
          var cm = document.getElementById('sol-cm')?.value;
          var duracion = 60;
          if (cm === '0-30') duracion = 90;
          else if (cm === '30-40') duracion = 120;
          else if (cm === '40-50') duracion = 150;
          else if (cm === '50-60') duracion = 180;
          else if (cm === '60-70') duracion = 210;
          else if (cm === '70-80') duracion = 240;
          else if (cm === '80-90') duracion = 270;
          
          var duracionGlobal = duracion;
          
          fetch(API + '/turnos/fecha/' + fecha).then(function(res) { return res.json(); }).then(function(turnos) {
var select = document.getElementById('sol-hora');
            if (!select) return;
            var opciones = select.options;
            for (var i = 1; i < opciones.length; i++) {
              opciones[i].disabled = false;
              opciones[i].style.color = '';
              opciones[i].style.textDecoration = 'none';
              opciones[i].text = opciones[i].value;
            }
            for (var i = 1; i < opciones.length; i++) {
              var horaOpt = opciones[i].value;
              var minutosOpt = horaToMinutos(horaOpt);
              var bloqueado = false;
              for (var j = 0; j < turnos.length; j++) {
                var ini = horaToMinutos(turnos[j].hora);
                var durTurno = turnos[j].tratamiento_duracion || 60;
                var finTurno = ini + durTurno;
                if (minutosOpt >= ini && minutosOpt < finTurno) {
                  bloqueado = true;
                  break;
                }
              }
              if (bloqueado) {
                opciones[i].disabled = true;
                opciones[i].style.color = '#999';
                opciones[i].style.textDecoration = 'line-through';
                opciones[i].text = horaOpt + ' (ocupado)';
              }
            }
          }).catch(function(err) { console.error('Error:', err); });
        }
      
      window.actualizarPrecioCM = function(valor) {
        var precios = {
          '0-30': 30000, '30-40': 32000, '40-50': 34000,
          '50-60': 36000, '60-70': 38000, '70-80': 40000, '80-90': 42000
        };
        var precio = precios[valor] || 0;
        if (precio > 0) {
          document.getElementById('precio-mostrado').style.display = 'block';
          document.getElementById('precio-turno').textContent = '$' + precio.toLocaleString('es-AR');
          document.getElementById('sol-precio-extra').value = precio;
        }
      };
      
      document.getElementById('solicitar-turno-form').onsubmit = async function(e) {

        var notasExtra = document.getElementById('sol-notas').value || '';

        function horaToMinutos(hora) {
          var h = parseInt(hora.split(':')[0]);

        async function cargarHorariosBloqueados() {
          var fecha = document.getElementById('sol-fecha').value;
          if (!fecha) return;
          
          var tratamientoId = document.getElementById('sol-tratamiento')?.value;
          if (!tratamientoId) {
            alert('Seleccioná primero un tratamiento');
            document.getElementById('sol-fecha').value = '';
            return;
          }
          
          var tratamientos = document.getElementById('sol-tratamiento').options;
          var nombre = tratamientos[tratamientos.selectedIndex].text;
          var duracion = 60;
          
          if (document.getElementById('sol-cm')) {
            var cm = document.getElementById('sol-cm').value;
            if (cm === '0-30') duracion = 90;
            else if (cm === '30-40') duracion = 120;
            else if (cm === '40-50') duracion = 150;
            else if (cm === '50-60') duracion = 180;
            else if (cm === '60-70') duracion = 210;
            else if (cm === '70-80') duracion = 240;
            else if (cm === '80-90') duracion = 270;
          }
          
          try {
            var res = await fetch(API + '/turnos/fecha/' + fecha);
            var turnos = await res.json();
            
            var bloques = [];
            turnos.forEach(function(t) {
              var inicio = horaToMinutos(t.hora);
              var dur = t.tratamiento_duracion || 60;
              var fin = inicio + dur;
              for (var m = inicio; m < fin; m += 30) {
                var h = Math.floor(m / 60);
                var min = m % 60;
                var horaBloque = h + ':' + min.toString().padStart(2, '0');
                if (!bloques.includes(horaBloque) && h >= 9 && h < 19) {
                  bloques.push(horaBloque);
                }
              }
            });
            
            var select = document.getElementById('sol-hora');
            var opciones = select.options;
            for (var i = 1; i < opciones.length; i++) {
              opciones[i].disabled = false;
              opciones[i].style.color = '';
              opciones[i].style.textDecoration = 'none';
            }
            
            for (var i = 1; i < opciones.length; i++) {
              var horaOpt = opciones[i].value;
              var minutosOpt = horaToMinutos(horaOpt);
              var finOpt = minutosOpt + duracion;
              var bloqueado = false;
              for (var j = 0; j < turnos.length; j++) {
                var ini = horaToMinutos(turnos[j].hora);
                var durTurno = turnos[j].tratamiento_duracion || 60;
                var finTurno = ini + durTurno;
                if (minutosOpt >= ini && minutosOpt < finTurno) {
                  bloqueado = true;
                  break;
                }
              }
              if (bloqueado) {
                opciones[i].disabled = true;
                opciones[i].style.color = '#999';
                opciones[i].style.textDecoration = 'line-through';
                opciones[i].text = horaOpt + ' (ocupado)';
              }
            }
            
          } catch(err) {
            console.error('Error cargando horarios:', err);
          }
        }
        
        document.getElementById('solicitar-turno-form').onsubmit = async function(e) {
          e.preventDefault();
          var msg = document.getElementById('solicitar-msg');
          
          var data = {
            cliente_id: user.id,
            tratamiento_id: document.getElementById('sol-tratamiento').value,
            fecha: document.getElementById('sol-fecha').value,
            hora: document.getElementById('sol-hora').value,
            notas: document.getElementById('sol-notas').value || 'Solicitado'
          };
          
          try {
            var res = await fetch(API + '/turnos', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
            });
            var result = await res.json();
            
            if (result.id || result.success) {
              msg.innerHTML = '<div class="msg success">¡Solicitud enviada!</div>';
              setTimeout(function() { showMisTurnos(); }, 2000);
            } else {
              msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
            }
          } catch(err) {
            msg.innerHTML = '<div class="msg error">Error de conexión</div>';
          }
        };
      } catch(err) {
        document.getElementById('solicitar-form').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    // EDITAR PERFIL
    function editarMiPerfil() {
      document.getElementById('modal-container').innerHTML = 
        '<div class="modal" style="display:flex;" onclick="if(event.target === this) closeModal()">' +
          '<div class="modal-content">' +
            '<h3>✏️ Editar Mi Perfil</h3>' +
            '<div id="edit-msg"></div>' +
            '<form id="edit-form">' +
              '<div class="form-group"><label>Nombre</label><input type="text" id="edit-nombre" value="' + (user.nombre || '') + '"></div>' +
              '<div class="form-group"><label>Teléfono</label><input type="tel" id="edit-telefono" value="' + (user.telefono || '') + '"></div>' +
              '<div class="form-group"><label>Email</label><input type="email" id="edit-email" value="' + (user.email || '') + '"></div>' +
              '<button type="submit" class="btn">Guardar</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById('edit-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('edit-msg');
        
        try {
          var res = await fetch(API + '/clientes/' + user.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              nombre: document.getElementById('edit-nombre').value,
              telefono: document.getElementById('edit-telefono').value || null,
              email: document.getElementById('edit-email').value || null
            })
          });
          var result = await res.json();
          
          if (result.success) {
            user.nombre = document.getElementById('edit-nombre').value;
            user.telefono = document.getElementById('edit-telefono').value;
            user.email = document.getElementById('edit-email').value;
            localStorage.setItem('u', JSON.stringify(user));
            closeModal();
            showClienteHome();
          } else {
            msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
    
    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }
    
    // PLANILLA FACIAL
    function mostrarPlanillaFacial(tratamientoId, tratamientoNombre) {
      document.getElementById('modal-container').innerHTML = 
        '<div class="modal" style="display:flex;" onclick="if(event.target === this) closeModal()">' +
          '<div class="modal-content" style="max-width:550px;max-height:90vh;overflow-y:auto;" onclick="event.stopPropagation()">' +
            '<h3>📋 Anamnesis Facial</h3>' +
            '<div style="background:#fff3e0;padding:12px;border-radius:8px;margin-bottom:15px;font-size:12px;color:#e65100;">💡 <strong>Primera sesión:</strong> Comenzamos siempre con la limpieza simple para ver tu tipo de piel, hacerte tu planilla médica, ver cómo reacciona tu piel y determinar qué necesitás.</div>' +
            '<p style="color:#666;font-size:13px;margin-bottom:15px;">Completá todos los datos antes de solicitar el turno</p>' +
            '<div id="planilla-msg"></div>' +
            '<form id="planilla-form" style="text-align:left;">' +
              '<div class="form-group"><label>Tipo de piel *</label><select id="plan-tipo-piel" required><option value="">Seleccionar</option><option value="Normal">Normal</option><option value="Seca">Seca</option><option value="Grasa">Grasa</option><option value="Mixta">Mixta</option><option value="Sensible">Sensible</option></select></div>' +
              '<div class="form-group"><label>¿Tienes manchas en la piel?</label><select id="plan-manchas"><option value="No">No</option><option value="Si">Sí</option><option value="Algunas">Algunas</option></select></div>' +
              '<div class="form-group"><label>¿Tienes acné o granitos?</label><select id="plan-acne"><option value="No">No</option><option value="Leve">Leve</option><option value="Moderado">Moderado</option><option value="Severo">Severo</option></select></div>' +
              '<div class="form-group"><label>¿Tienes arrugas?</label><select id="plan-arrugas"><option value="No">No</option><option value="Ligeras">Ligeras</option><option value="Marcadas">Marcadas</option><option value="Muy marcadas">Muy marcadas</option></select></div>' +
              '<div class="form-group"><label>¿Tienes rojeces o cuperosis?</label><select id="plan-rojeces"><option value="No">No</option><option value="Si">Sí</option><option value="Leve">Leve</option></select></div>' +
              '<div class="form-group"><label>¿Tienes capilares visibles?</label><select id="plan-capilares"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Usás protector solar?</label><select id="plan-protector"><option value="">Seleccionar</option><option value="Siempre">Siempre</option><option value="A veces">A veces</option><option value="Nunca">Nunca</option></select></div>' +
              '<div class="form-group"><label>¿Tenés piel sensible?</label><select id="plan-sensible"><option value="No">No</option><option value="Si">Sí</option><option value="A veces">A veces</option></select></div>' +
              '<div class="form-group"><label>¿Has hecho tratamientos faciales antes?</label><select id="plan-tratamientos-anteriores"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Alergias a cosméticos o ingredientes?</label><select id="plan-alergias"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Tomás medicamentos regularmente?</label><select id="plan-medicamentos"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Problemas de salud importantes?</label><select id="plan-problemas"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Embarazada?</label><select id="plan-embarazada"><option value="No">No</option><option value="Si">Sí</option></select></div>' +
              '<div class="form-group"><label>¿Fumás?</label><select id="plan-fuma"><option value="No">No</option><option value="Si">Sí</option><option value="A veces">A veces</option></select></div>' +
              '<div class="form-group"><label>¿Qué zona te preocupa más?</label><select id="plan-zona"><option value="">Seleccionar</option><option value="Rostro completo">Rostro completo</option><option value="Frente">Frente</option><option value="Mejillas">Mejillas</option><option value="Nariz">Nariz</option><option value="Menton">Menton/Boca</option><option value="Ojos">Contorno de ojos</option><option value="Cuello">Cuello</option></select></div>' +
              '<div class="form-group"><label>¿Qué esperás del tratamiento?</label><textarea id="plan-expectativas" rows="3" placeholder="Ej: Quiero mejorar las manchas, tener la piel más limpia..."></textarea></div>' +
              '<div class="form-group"><label>Comentarios adicionales</label><textarea id="plan-comentarios" rows="2" placeholder="Algo que consideres importante..."></textarea></div>' +
              '<button type="submit" class="btn">💾 Guardar Planilla y Solicitar Turno</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById('planilla-form').onsubmit = async function(e) {
        e.preventDefault();
        
        var tipoPiel = document.getElementById('plan-tipo-piel').value;
        if (!tipoPiel) {
          document.getElementById('planilla-msg').innerHTML = '<div class="msg error">Debés seleccionar el tipo de piel</div>';
          return;
        }
        
        var msg = document.getElementById('planilla-msg');
        msg.innerHTML = '<div class="msg" style="background:#f0f0f0;">Guardando...</div>';
        
        var datos = {
          tipo_piel: document.getElementById('plan-tipo-piel').value,
          manchas: document.getElementById('plan-manchas').value,
          acne: document.getElementById('plan-acne').value,
          arrugas: document.getElementById('plan-arrugas').value,
          rojeces: document.getElementById('plan-rojeces').value,
          capilares: document.getElementById('plan-capilares').value,
          protector_solar: document.getElementById('plan-protector').value,
          piel_sensible: document.getElementById('plan-sensible').value,
          tratamientos_previos: document.getElementById('plan-tratamientos-anteriores').value,
          alergias: document.getElementById('plan-alergias').value,
          medicamentos: document.getElementById('plan-medicamentos').value,
          problemas_salud: document.getElementById('plan-problemas').value,
          embarazada: document.getElementById('plan-embarazada').value,
          fuma: document.getElementById('plan-fuma').value,
          zona_preocupa: document.getElementById('plan-zona').value,
          expectativas: document.getElementById('plan-expectativas').value,
          comentarios: document.getElementById('plan-comentarios').value
        };
        
        try {
          var res = await fetch(API + '/legajos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              cliente_id: user.id,
              tratamiento: tratamientoNombre,
              tipo: 'facial',
              fecha: new Date().toISOString().split('T')[0],
              datos: JSON.stringify(datos)
            })
          });
          
          if (!res.ok) {
            var errData = await res.json();
            msg.innerHTML = '<div class="msg error">Error: ' + (errData.error || 'No se pudo guardar') + '</div>';
            return;
          }
          
          msg.innerHTML = '<div class="msg success">¡Planilla guardada! Solicitando turno...</div>';
          
          var resTurno = await fetch(API + '/turnos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              cliente_id: user.id,
              tratamiento_id: tratamientoId,
              fecha: new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0],
              hora: '10:00',
              notas: 'Tratamiento facial - Anamnesis completada'
            })
          });
          
          if (!resTurno.ok) {
            msg.innerHTML = '<div class="msg error">Planilla guardada, pero no se pudo solicitar el turno. Contactá por WhatsApp.</div>';
            return;
          }
          
          msg.innerHTML = '<div class="msg success">¡Todo listo! Tu planilla fue guardada y el turno solicitado.</div>';
          setTimeout(function() { closeModal(); showMisTurnos(); }, 2500);
          
        } catch(err) {
          console.error('Error:', err);
          msg.innerHTML = '<div class="msg error">Error de conexión. Intentá de nuevo.</div>';
        }
      };
    }
  </script>
