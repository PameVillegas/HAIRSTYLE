<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairStyle - Mi Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; padding: 20px; max-width: 600px; margin: 0 auto; }
    
    .header {
      text-align: center;
      padding: 25px 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 26px; color: white; }
    .header .welcome { color: #ffd54f; font-size: 18px; font-weight: 600; }
    
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card h2 { font-family: 'Poppins', sans-serif; color: #e91e63; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .menu-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 10px; background: linear-gradient(135deg, #e91e63, #9c27b0);
      border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer; transition: transform 0.2s;
    }
    .menu-box:active { transform: scale(0.95); }
    .menu-box .menu-icon { font-size: 28px; margin-bottom: 8px; }
    .menu-box .menu-label { font-weight: 600; font-size: 12px; color: white; text-align: center; }
    .menu-box.secondary { background: white; border: 2px solid #e91e63; }
    .menu-box.secondary .menu-label { color: #e91e63; }
    
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; background: rgba(255,255,255,0.2); color: white;
      border: none; border-radius: 20px; cursor: pointer; margin-bottom: 20px; font-size: 14px;
    }
    
    .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.9; }
    .btn.secondary { background: white; color: #e91e63; border: 2px solid #e91e63; }
    .btn.danger { background: #f44336; }
    .btn.small { padding: 10px 16px; font-size: 14px; width: auto; display: inline-block; }
    
    .info-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info-item:last-child { border-bottom: none; }
    .info-item .label { color: #666; font-size: 14px; }
    .info-item .value { font-weight: 600; color: #333; }
    
    .turno-item { padding: 15px; background: #f8f8f8; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #e91e63; }
    .turno-item .fecha { font-weight: 600; color: #333; }
    .turno-item .detalle { font-size: 13px; color: #666; margin-top: 5px; }
    .turno-item .estado { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin-top: 8px; }
    .estado.pendiente { background: #fff3e0; color: #ff9800; }
    .estado.completado { background: #e8f5e9; color: #4caf50; }
    .estado.cancelado { background: #ffebee; color: #f44336; }
    
    .trat-card { background: #f8f8f8; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .trat-image { width: 100%; height: 140px; object-fit: cover; background: #ddd; }
    .trat-content { padding: 12px; text-align: center; }
    .trat-content .name { font-weight: 600; color: #333; font-size: 16px; }
    .trat-content .detail { font-size: 13px; color: #666; margin-top: 5px; }
    .trat-content .precio { font-weight: 700; color: #4caf50; margin-top: 10px; font-size: 18px; }
    .trat-content .solicitar { display: block; width: 100%; margin-top: 10px; padding: 10px; background: #e91e63; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .trat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .galeria-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; }
    .galeria-categoria { margin-bottom: 15px; }
    .galeria-categoria h3 { color: #e91e63; font-size: 14px; margin-bottom: 8px; }
    
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: white; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Poppins', sans-serif; color: #e91e63; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 4px; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
    .form-group input:focus { outline: none; border-color: #e91e63; }
    
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .msg.success { background: #e8f5e9; color: #4caf50; }
    .msg.error { background: #ffebee; color: #f44336; }
    
    .whatsapp-float {
      position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px;
      background: #25D366; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 28px;
      text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9998;
    }
    
    .testimonio-card { background: #f8f8f8; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
    .testimonio-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #e91e63, #9c27b0); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; }
    .testimonio-nombre { font-weight: 600; color: #333; font-size: 15px; }
    .testimonio-estrellas { color: #ffc107; font-size: 14px; }
    .testimonio-texto { color: #666; font-size: 14px; line-height: 1.5; margin-top: 10px; }
    
    .loading { text-align: center; padding: 40px; color: #666; }
    .empty-state { text-align: center; padding: 30px; color: #666; }
    
    .sobre-nosotros { background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .sobre-nosotros img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #e91e63; margin-bottom: 15px; }
    .perfil-nombre { font-family: 'Poppins', sans-serif; font-size: 20px; color: #e91e63; margin-bottom: 5px; }
    .perfil-edad { color: #666; font-size: 16px; margin-bottom: 20px; }
    .perfil-desc { text-align: left; color: #666; font-size: 14px; line-height: 1.6; }
    .perfil-desc p { margin-bottom: 12px; }
    .perfil-desc ul { margin: 10px 0 10px 20px; }
    .perfil-desc li { margin-bottom: 6px; }
    
    .redes-link { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; text-decoration: none; }
    .redes-link.instagram { background: #E1306C; color: white; }
    
    @media (max-width: 400px) {
      .trat-grid { grid-template-columns: 1fr; }
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
  <a href="https://wa.me/543388673804" target="_blank" class="whatsapp-float">💬</a>
  <div class="container">
    <div id="app"></div>
  </div>
  <div id="modal-container"></div>

  <script>
    var API = '/api';
    var u = localStorage.getItem('u');
    var t = localStorage.getItem('t');
    var user = null;
    
    if (!u || t !== 'cliente') {
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h2>Acceso denegado</h2>' +
          '<p>Esta sección es solo para clientes</p>' +
          '<a href="/entrar.html" class="btn">Ir al login</a>' +
        '</div>';
    } else {
      user = JSON.parse(u);
      window.user = user;
      showClienteHome();
    }
    
    function logout() {
      localStorage.removeItem('u');
      localStorage.removeItem('t');
      window.location.href = '/entrar.html';
    }
    
    function showClienteHome() {
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h1>HairStyle</h1>' +
          '<p class="welcome">¡Hola, ' + user.nombre + '!</p>' +
          '<p style="color:rgba(255,255,255,0.8);font-size:14px;margin-top:5px;">Bienvenida a tu cuenta</p>' +
        '</div>' +
        
        '<div class="menu-grid">' +
          '<div class="menu-box" onclick="showServicios()"><span class="menu-icon">💅</span><span class="menu-label">Servicios</span></div>' +
          '<div class="menu-box" onclick="showGaleriaCliente()"><span class="menu-icon">📸</span><span class="menu-label">Galería</span></div>' +
          '<div class="menu-box" onclick="showMisTurnos()"><span class="menu-icon">📅</span><span class="menu-label">Turnos</span></div>' +
          '<div class="menu-box" onclick="showTestimonios()"><span class="menu-icon">⭐</span><span class="menu-label">Reseñas</span></div>' +
          '<div class="menu-box" onclick="showPromociones()"><span class="menu-icon">🎉</span><span class="menu-label">Promos</span></div>' +
          '<div class="menu-box" onclick="showSobreNosotros()"><span class="menu-icon">✨</span><span class="menu-label">Sobre Mí</span></div>' +
          '<div class="menu-box" onclick="showPoliticas()"><span class="menu-icon">📜</span><span class="menu-label">Políticas</span></div>' +
          '<div class="menu-box" onclick="showTerminos()"><span class="menu-icon">📋</span><span class="menu-label">Términos</span></div>' +
          '<div class="menu-box" onclick="showSolicitarTurno()"><span class="menu-icon">📆</span><span class="menu-label">Turno</span></div>' +
        '</div>' +
        
        '<div class="card">' +
          '<h2>👤 Mi Perfil</h2>' +
          '<div class="info-item"><span class="label">Nombre</span><span class="value">' + (user.nombre || '-') + '</span></div>' +
          '<div class="info-item"><span class="label">Teléfono</span><span class="value">' + (user.telefono || '-') + '</span></div>' +
          '<button class="btn secondary" onclick="editarMiPerfil()">✏️ Editar Mi Perfil</button>' +
        '</div>' +
        
        '<button class="back-btn" style="background:rgba(255,255,255,0.2);width:100%;text-align:center;margin-top:20px;" onclick="logout()">🚪 Cerrar sesión</button>';
    }
    
    // SERVICIOS
    async function showServicios() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>💅 Servicios</h1></div>' +
        '<div class="card"><div id="serv-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/tratamientos');
        var tratamientos = await res.json();
        
        if (tratamientos.length > 0) {
          var html = '<div class="trat-grid">';
          tratamientos.forEach(function(t) {
            var precio = parseFloat(t.precio || 0);
            var img = t.imagen_url || '/fotos/logo.png';
            var nombre = t.nombre || '';
            var esFacial = nombre.toUpperCase().indexOf('FACIAL') >= 0;
            
            html += '<div class="trat-card">' +
              '<img src="' + img + '" class="trat-image" onerror="this.src=\'/fotos/logo.png\'">' +
              '<div class="trat-content">' +
                '<div class="name">' + nombre + '</div>' +
                '<div class="detail">' + t.duracion + ' min - ' + (t.descripcion || '') + '</div>' +
                '<div class="precio">' + (precio > 0 ? '$' + precio.toLocaleString('es-AR') : 'Consultar precio') + '</div>';
            
            if (precio === 0) {
              var mensaje = encodeURIComponent('Hola! Quiero consultar por el tratamiento: ' + nombre);
              html += '<a href="https://wa.me/543388673804?text=' + mensaje + '" class="solicitar" style="display:block;text-align:center;text-decoration:none;">💬 Consultar</a>';
            } else if (esFacial) {
              html += '<button class="solicitar" onclick="mostrarPlanillaFacial(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📋 Planilla</button>';
            } else {
              html += '<button class="solicitar" onclick="solicitarTurnoTratamiento(' + t.id + ', \'' + nombre.replace(/'/g, "\\'") + '\')">📅 Turno</button>';
            }
            
            html += '</div></div>';
          });
          html += '</div>';
          document.getElementById('serv-content').innerHTML = html;
        } else {
          document.getElementById('serv-content').innerHTML = '<div class="empty-state">No hay servicios disponibles</div>';
        }
      } catch(err) {
        document.getElementById('serv-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    function solicitarTurnoTratamiento(tratamientoId, tratamientoNombre) {
      showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre);
    }
    
    async function showSolicitarTurnoConTratamiento(tratamientoId, tratamientoNombre) {
      var manana = new Date();
      manana.setDate(manana.getDate() + 1);
      var fechaMin = manana.toISOString().split('T')[0];
      
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showServicios()">← Volver</button>' +
        '<div class="header"><h1>📅 Turno: ' + tratamientoNombre + '</h1></div>' +
        '<div class="card"><div id="solicitar-form"></div></div>';
      
      document.getElementById('solicitar-form').innerHTML = 
        '<div id="solicitar-msg"></div>' +
        '<form id="solicitar-turno-form">' +
          '<div class="form-group"><label>Tratamiento</label><input type="text" value="' + tratamientoNombre + '" disabled></div>' +
          '<div class="form-group"><label>Fecha *</label><input type="date" id="sol-fecha" min="' + fechaMin + '" required></div>' +
          '<div class="form-group"><label>Horario *</label><select id="sol-hora" required>' +
            '<option value="">Seleccionar</option>' +
            '<option value="09:00">09:00</option><option value="09:30">09:30</option>' +
            '<option value="10:00">10:00</option><option value="10:30">10:30</option>' +
            '<option value="11:00">11:00</option><option value="11:30">11:30</option>' +
            '<option value="12:00">12:00</option><option value="12:30">12:30</option>' +
            '<option value="13:00">13:00</option><option value="13:30">13:30</option>' +
            '<option value="14:00">14:00</option><option value="14:30">14:30</option>' +
            '<option value="15:00">15:00</option><option value="15:30">15:30</option>' +
            '<option value="16:00">16:00</option><option value="16:30">16:30</option>' +
            '<option value="17:00">17:00</option><option value="17:30">17:30</option>' +
            '<option value="18:00">18:00</option>' +
          '</select></div>' +
          '<div class="form-group"><label>Notas</label><textarea id="sol-notas" rows="3" placeholder="Observaciones..."></textarea></div>' +
          '<button type="submit" class="btn">📨 Solicitar Turno</button>' +
        '</form>';
      
      document.getElementById('solicitar-turno-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('solicitar-msg');
        
        var data = {
          cliente_id: user.id,
          tratamiento_id: tratamientoId,
          fecha: document.getElementById('sol-fecha').value,
          hora: document.getElementById('sol-hora').value,
          notas: document.getElementById('sol-notas').value || 'Solicitado por cliente'
        };
        
        try {
          var res = await fetch(API + '/turnos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
          });
          var result = await res.json();
          
          if (result.id || result.success) {
            msg.innerHTML = '<div class="msg success">¡Turno solicitado! Te contactaremos.</div>';
            setTimeout(function() { showMisTurnos(); }, 2000);
          } else {
            msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
    
    // MIS TURNOS
    async function showMisTurnos() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📅 Mis Turnos</h1></div>' +
        '<div class="card"><div id="turnos-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/cliente/' + user.id);
        var data = await res.json();
        
        if (data.success && data.turnos && data.turnos.length > 0) {
          var html = '';
          data.turnos.forEach(function(t) {
            var badgeClass = t.estado === 'pendiente' ? 'pendiente' : (t.estado === 'completado' ? 'completado' : 'cancelado');
            html += '<div class="turno-item">' +
              '<div class="fecha">📅 ' + t.fecha + ' - ' + t.hora + '</div>' +
              '<div class="detalle">💅 ' + t.tratamiento + '</div>' +
              '<span class="estado ' + badgeClass + '">' + t.estado + '</span>' +
            '</div>';
          });
          document.getElementById('turnos-content').innerHTML = html;
        } else {
          document.getElementById('turnos-content').innerHTML = '<div class="empty-state">No tenés turnos</div>';
        }
      } catch(err) {
        document.getElementById('turnos-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    // GALERÍA
    async function showGaleriaCliente() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📸 Galería</h1></div>' +
        '<div class="card"><div id="galeria-content"><div class="loading">Cargando...</div></div></div>';
      
      try {
        var res = await fetch(API + '/galeria/local');
        var galeria = await res.json();
        
        if (galeria.length === 0) {
          document.getElementById('galeria-content').innerHTML = '<div class="empty-state">No hay fotos</div>';
        } else {
          var html = '';
          galeria.forEach(function(cat) {
            html += '<div class="galeria-categoria">' +
              '<h3>' + (cat.icon || '📷') + ' ' + cat.nombre + '</h3>' +
              '<div class="galeria-grid">';
            cat.imagenes.forEach(function(img) {
              html += '<img src="' + img.url + '" class="galeria-img" onerror="this.style.display=\'none\'">';
            });
            html += '</div></div>';
          });
          document.getElementById('galeria-content').innerHTML = html;
        }
      } catch(err) {
        document.getElementById('galeria-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    // TESTIMONIOS
    async function showTestimonios() {
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>⭐ Reseñas</h1></div>' +
        '<div class="card"><button class="btn secondary" onclick="showAgregarTestimonio()">✍️ Escribir reseña</button><div id="testimonios-list" style="margin-top:15px;"></div></div>';
      
      try {
        var res = await fetch(API + '/testimonios');
        var testimonios = await res.json();
        
        var container = document.getElementById('testimonios-list');
        
        if (testimonios.length === 0) {
          container.innerHTML = '<div class="empty-state">Aún no hay reseñas</div>';
        } else {
          var html = '';
          testimonios.forEach(function(t) {
            var estrellas = '⭐'.repeat(t.calificacion || 5);
            var inicial = (t.cliente_nombre || 'C').charAt(0).toUpperCase();
            html += '<div class="testimonio-card">' +
              '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">' +
                '<div class="testimonio-avatar">' + inicial + '</div>' +
                '<div><div class="testimonio-nombre">' + (t.cliente_nombre || 'Cliente') + '</div>' +
                '<div class="testimonio-estrellas">' + estrellas + '</div></div>' +
              '</div>' +
              '<div class="testimonio-texto">"' + t.texto + '"</div>' +
            '</div>';
          });
          container.innerHTML = html;
        }
      } catch(err) {
        document.getElementById('testimonios-list').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    function showAgregarTestimonio() {
      document.getElementById('modal-container').innerHTML = 
        '<div class="modal" onclick="closeModal()">' +
          '<div class="modal-content">' +
            '<h3>✍️ Tu Reseña</h3>' +
            '<div id="testimonio-msg"></div>' +
            '<form id="testimonio-form">' +
              '<div class="form-group"><label>Tu opinión</label><textarea id="test-texto" rows="4" placeholder="Contanos..." required style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;resize:none;"></textarea></div>' +
              '<button type="submit" class="btn">Enviar Reseña</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById('testimonio-form').onsubmit = async function(e) {
        e.preventDefault();
        var texto = document.getElementById('test-texto').value;
        
        try {
          var res = await fetch(API + '/testimonios', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},

    // SOLICITAR TURNO
    async function showSolicitarTurno() {
      var manana = new Date();
      manana.setDate(manana.getDate() + 1);
      var fechaMin = manana.toISOString().split('T')[0];
      
      document.getElementById('app').innerHTML = 
        '<button class="back-btn" onclick="showClienteHome()">← Volver</button>' +
        '<div class="header"><h1>📅 Solicitar Turno</h1></div>' +

      try {

        var tratamientoOptions = '<option value="">Seleccionar</option>';
        tratamientos.forEach(function(t) {
          var precio = parseFloat(t.precio || 0);
          var precioTexto = precio > 0 ? '$' + precio.toLocaleString('es-AR') : 'Consultar';
          tratamientoOptions += '<option value="' + t.id + '">' + t.nombre + ' (' + precioTexto + ')</option>';
        });
        
        document.getElementById('solicitar-form').innerHTML = 
          '<div id="solicitar-msg"></div>' +
          '<form id="solicitar-turno-form">' +
            '<div class="form-group"><label>Tratamiento *</label><select id="sol-tratamiento" required>' + tratamientoOptions + '</select></div>' +
            '<div class="form-group"><label>Fecha *</label><input type="date" id="sol-fecha" min="' + fechaMin + '" required></div>' +
            '<div class="form-group"><label>Horario *</label><select id="sol-hora" required>' +
              '<option value="">Seleccionar</option>' +
              '<option value="09:00">09:00</option><option value="09:30">09:30</option>' +

              '<option value="11:00">11:00</option><option value="11:30">11:30</option>' +
              '<option value="12:00">12:00</option><option value="12:30">12:30</option>' +
              '<option value="13:00">13:00</option><option value="13:30">13:30</option>' +
              '<option value="14:00">14:00</option><option value="14:30">14:30</option>' +
              '<option value="15:00">15:00</option><option value="15:30">15:30</option>' +
              '<option value="16:00">16:00</option><option value="16:30">16:30</option>' +
              '<option value="17:00">17:00</option><option value="17:30">17:30</option>' +
              '<option value="18:00">18:00</option>' +
            '</select></div>' +
            '<div class="form-group"><label>Notas</label><textarea id="sol-notas" rows="3" placeholder="Algo especial..."></textarea></div>' +
            '<button type="submit" class="btn">📨 Enviar Solicitud</button>' +
          '</form>';
        
        document.getElementById('solicitar-turno-form').onsubmit = async function(e) {
          e.preventDefault();
          var msg = document.getElementById('solicitar-msg');
          
          var data = {
            cliente_id: user.id,
            tratamiento_id: document.getElementById('sol-tratamiento').value,
            fecha: document.getElementById('sol-fecha').value,
            hora: document.getElementById('sol-hora').value,
            notas: document.getElementById('sol-notas').value || 'Solicitado'
          };
          
          try {
            var res = await fetch(API + '/turnos', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
            });
            var result = await res.json();
            
            if (result.id || result.success) {
              msg.innerHTML = '<div class="msg success">¡Solicitud enviada!</div>';
              setTimeout(function() { showMisTurnos(); }, 2000);
            } else {
              msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
            }
          } catch(err) {
            msg.innerHTML = '<div class="msg error">Error de conexión</div>';
          }
        };

        document.getElementById('solicitar-form').innerHTML = '<div class="empty-state">Error cargando</div>';

          if (result.success) {
            user.nombre = document.getElementById('edit-nombre').value;
            user.telefono = document.getElementById('edit-telefono').value;
            user.email = document.getElementById('edit-email').value;

            closeModal();
            showClienteHome();
          } else {
            msg.innerHTML = '<div class="msg error">' + (result.error || 'Error') + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
