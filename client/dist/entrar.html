<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e91e63">
  <title>HairStyle - Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 35px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo {
      display: block;
      margin: 0 auto 15px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e91e63;
    }
    h2 {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      color: #e91e63;
      margin-bottom: 8px;
      font-size: 26px;
    }
    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      font-size: 16px;
      font-family: 'Roboto', sans-serif;
      transition: border-color 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #e91e63;
    }
    input::placeholder {
      color: #aaa;
    }
    select {
      background: white;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: white;
      color: #e91e63;
      border: 2px solid #e91e63;
    }
    .error {
      color: #f44336;
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      padding: 10px;
      background: #ffebee;
      border-radius: 8px;
    }
    .success {
      color: #4caf50;
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="/fotos/logo.png" class="logo" alt="HairStyle">
    <h2>HairStyle</h2>
    <p>Ingresá a tu cuenta</p>
    <div id="msg"></div>
    <form id="form">
      <input type="text" id="user" placeholder="Usuario" required>
      <input type="password" id="pass" placeholder="Contraseña" required>
      <select id="tipo">
        <option value="admin">Administrador</option>
        <option value="cliente">Cliente</option>
      </select>
      <button type="submit" id="btn">INGRESAR</button>
      <button type="button" class="btn-secondary" onclick="window.location.href='/registro.html'">¿No tenés cuenta? Creá una</button>
    </form>
  </div>

  <script>
    document.getElementById('form').onsubmit = async function(e) {
      e.preventDefault();
      var u = document.getElementById('user').value;
      var p = document.getElementById('pass').value;
      var t = document.getElementById('tipo').value;
      var btn = document.getElementById('btn');
      var msg = document.getElementById('msg');
      
      btn.disabled = true;
      btn.textContent = 'CARGANDO...';
      msg.innerHTML = '';
      
      try {
        var res = await fetch('/api/auth/' + t, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        var data = await res.json();
        
        if (data.success) {
          msg.innerHTML = '<div class="success">¡Acceso exitoso!</div>';
          localStorage.setItem('u', JSON.stringify(data.user));
          localStorage.setItem('t', t);
          var destino = t === 'admin' ? '/panel.html' : '/cliente.html';
          setTimeout(function() { window.location.href = destino; }, 500);
        } else {
          msg.innerHTML = '<div class="error">' + (data.error || 'Credenciales incorrectas') + '</div>';
          btn.disabled = false;
          btn.textContent = 'INGRESAR';
        }
      } catch(err) {
        msg.innerHTML = '<div class="error">Error de conexión</div>';
        btn.disabled = false;
        btn.textContent = 'INGRESAR';
      }
    };
  </script>
</body>
</html>
