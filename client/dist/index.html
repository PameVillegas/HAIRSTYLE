<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e91e63">
  <title>HairStyle - Login v5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .logo {
      display: block;
      margin: 0 auto 15px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    h2 {
      text-align: center;
      color: #e91e63;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
    }
    .error {
      color: red;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="/fotos/logo.png" alt="HairStyle" class="logo">
    <h2>HairStyle</h2>
    <p>Ingresá a tu cuenta</p>
    <div id="error" class="error"></div>
    <form id="login-form">
      <input type="text" id="username" placeholder="Usuario" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <select id="tipo">
        <option value="admin">Administrador</option>
        <option value="cliente">Cliente</option>
      </select>
      <button type="submit" id="btn">Ingresar</button>
    </form>
    <p style="margin-top:15px;text-align:center;font-size:13px;">
      ¿No tenés cuenta? <a href="/registro.html" style="color:#e91e63;font-weight:bold;">Registrate aquí</a>
    </p>
  </div>

  <script>
    console.log('=== NEW LOGIN SCRIPT LOADED ===');
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn');
    const errorDiv = document.getElementById('error');
    console.log('Form found:', !!form);

    form.addEventListener('submit', async function(e) {
      console.log('=== FORM SUBMITTED ===');
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const tipo = document.getElementById('tipo').value;
      
      console.log('Login attempt:', username, tipo);
      
      btn.textContent = 'Ingresando...';
      btn.disabled = true;
      errorDiv.textContent = '';

      try {
        console.log('Fetching...');
        const res = await fetch('/api/auth/' + tipo, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: username, password: password})
        });
        
        console.log('Response status:', res.status);
        const data = await res.json();
        console.log('Response data:', data);
        
        if (data.success) {
          console.log('Login success, redirecting to:', tipo);
          localStorage.setItem('u', JSON.stringify(data.user));
          localStorage.setItem('t', tipo);
          setTimeout(function() {
            window.location.href = tipo === 'admin' ? '/panel.html' : '/cliente.html';
          }, 100);
        } else {
          errorDiv.textContent = data.error || 'Credenciales incorrectas';
          btn.textContent = 'Ingresar';
          btn.disabled = false;
        }
      } catch(err) {
        console.error('Error:', err);
        errorDiv.textContent = 'Error de conexión';
        btn.textContent = 'Ingresar';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
